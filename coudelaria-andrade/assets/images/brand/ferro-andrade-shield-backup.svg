<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <style>
      .iron-brand {
        fill: none;
        stroke: #161c14;
        stroke-width: 6.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .iron-fill {
        fill: #161c14;
      }
    </style>
  </defs>

  <!-- Background: Diagonal partition (Green top-left, Gold bottom-right) -->
  <polygon points="0,0 184,0 24,240 0,240" fill="#245831" />
  <polygon points="184,0 200,0 200,240 24,240" fill="#ed9807" />

  <!-- The Iron Monogram: SA -->
  <g id="ferro-sa">
    <!-- Letter A Horseshoe/Omega Arch: convex rounded dome, widest at crossbar, curving inward toward center at bottom -->
    <path class="iron-brand" d="
      M 40,222
      L 52,222
      C 48,206 38,180 30,154
      C 24,136 24,124 24,124
      C 24,62 56,24 100,24
      C 144,24 176,62 176,124
      C 176,124 176,136 170,154
      C 162,180 152,206 148,222
      L 160,222
    " />

    <!-- A Crossbar -->
    <line class="iron-brand" x1="24" y1="124" x2="176" y2="124" />

    <!-- Letter S (Intertwined) -->
    <!-- Top terminal: hook with serif -->
    <path class="iron-brand" d="
      M 124,70
      C 124,62 126,52 118,44
      C 112,36 104,36 98,36
      C 80,36 66,50 66,72
      C 66,96 84,110 100,124
      C 118,138 138,154 138,176
      C 138,198 120,210 100,210
      C 82,210 68,198 64,178
      L 64,166
    " />
    
    <!-- Top serif on S -->
    <path class="iron-brand" stroke-width="4.5" d="M 124,70 L 130,76" />

    <!-- Sharp upward-pointing barbed arrowhead at bottom of S -->
    <polygon class="iron-fill" points="64,158 57,170 71,168" />
  </g>
</svg>